name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm run test

      - name: Type check
        run: pnpm run build:type-check

  smoke:
    name: HTTP Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Start dev server
        run: pnpm dev &
        env:
          VITE_BASE: ./

      - name: Wait for server
        run: npx wait-on http://localhost:5170

      - name: HTTP smoke 5 routes
        run: |
          for p in / /manage/quality /business/apply /review/promises /review/standards; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:5170$p")
            echo "$p: $CODE"
            if [ "$CODE" != "200" ]; then
              echo "::error::Smoke test failed at $p"
              exit 1
            fi
          done

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Run e2e tests
        run: pnpm run e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

  structure:
    name: Project Structure
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Verify project structure
        run: |
          test -f src/main.ts
          test -f src/router.ts
          test -d src/stores
          test -d src/pages
          STORES=$(find src/stores -name "*.ts" | wc -l)
          PAGES=$(find src/pages -name "*.vue" | wc -l)
          echo "stores: $STORES"
          echo "pages: $PAGES"
          if [ "$STORES" -lt 10 ]; then
            echo "::error::Stores too few: $STORES < 10"
            exit 1
          fi
          if [ "$PAGES" -lt 30 ]; then
            echo "::error::Pages too few: $PAGES < 30"
            exit 1
          fi
